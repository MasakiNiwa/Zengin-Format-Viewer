name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 自己診断（レイアウト・往復変換・検証ロジック）
        run: node tools/selftest.mjs
      - name: レイアウト仕様が最新か確認
        run: |
          node tools/gen-format-doc.mjs
          git diff --exit-code docs/format-spec.md
      - name: Playwright を用意
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: ブラウザでの動作確認
        run: node tools/browser-test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
